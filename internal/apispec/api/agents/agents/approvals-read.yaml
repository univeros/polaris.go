# GET /agents/approvals/code?user_code=: the approval behind a user code.
endpoint:
  method: GET
  path: /agents/approvals/code
  summary: Read the approval behind a user code
  tags: [agents]
  auth: bearer
  effect: read
  receipt: false

input:
  source: query
  fields:
    user_code: { type: string, rules: [required] }

domain:
  description: >
    For the host's approval page (device_authorization): the pending approval the signed-in owner's code
    stands for (dashes and case do not matter), the agent, the grants asked and the strength needed, so
    they can decide with POST /agents/approvals/{id}/decide. The registration of a host the server does not
    know (POST /agent/register) is for whoever signs in with its code: it also has host (id, name,
    key_thumbprint, known) and reason, which the host tells and nothing proves, and the agent as the caller
    would own it. Where such hosts are taken, codes that stand for none of the caller's agents' approvals are
    limited per person.

output:
  status: 200
  example:
    data: { id: "018f...", agent_id: "018f...", grant_ids: ["018f..."], method: device_authorization, strength: step_up, user_code: "BCDF-GHJK", binding_message: null, status: pending, decided_by: null, expires_at: "2026-10-10T10:10:00Z", created_at: "2026-10-10T10:00:00Z", updated_at: "2026-10-10T10:00:00Z", verification_uri: "https://app.example.com/agents/approve", verification_uri_complete: "https://app.example.com/agents/approve?user_code=BCDF-GHJK", expires_in: 600, interval: 5, agent: { id: "018f...", owner_type: user, owner_id: "018f...", organization_id: "018f...", name: "Deploy bot", mode: autonomous, host_id: null, auth: private_key_jwt, public_jwk: { kty: EC, crv: P-256, x: "...", y: "...", alg: ES256, kid: "...", use: sig }, status: active, created_by: "018f...", sealed_at: null, created_at: "2026-10-10T10:00:00Z", updated_at: "2026-10-10T10:00:00Z" }, grants: [{ id: "018f...", agent_id: "018f...", capability: "deploy.staging", constraints: {}, budget: { kind: count, total: 100, remaining: 100, field: null }, status: active, granted_by: null, approved_via: auto, approval_id: null, expires_at: null, created_at: "2026-10-10T10:00:00Z", updated_at: "2026-10-10T10:00:00Z" }] }

errors:
  - { status: 401, code: unauthorized }
  - { status: 404, code: agents_not_found }
  - { status: 429, code: too_many_requests }

events: []
