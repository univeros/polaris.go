# POST /agent/revoke: the Agent Auth Protocol's agent revocation (§5.7).
endpoint:
  method: POST
  path: /agent/revoke
  summary: Revoke an agent (Agent Auth Protocol)
  tags: [agents]
  auth: public   # the host authenticates itself: a host JWT (typ host+jwt)
  effect: destructive
  receipt: true

input:
  source: body
  fields:
    agent_id: { type: string, rules: [required] }

domain:
  description: >
    The kill switch for an agent of the calling host, pending or suspended too: its client and tokens
    disabled, its grants and approvals ended, its receipt chain sealed. One revoked already answers the same.
    Another host's agent is answered as none.

output:
  status: 200
  example: { agent_id: "018f...", status: revoked }

errors:
  - { status: 400, code: invalid_request }
  - { status: 401, code: invalid_jwt }
  - { status: 403, code: host_revoked }
  - { status: 403, code: agent_rejected }
  - { status: 404, code: agent_not_found }
  - { status: 429, code: rate_limited }

events: [agent.revoked, agent.receipt.sealed]
