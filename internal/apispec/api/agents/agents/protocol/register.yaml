# POST /agent/register: the Agent Auth Protocol's agent registration (§5.3).
endpoint:
  method: POST
  path: /agent/register
  summary: Register an agent (Agent Auth Protocol)
  tags: [agents]
  auth: public   # the host authenticates itself: a host JWT (typ host+jwt)
  rate_limit: token_refresh
  effect: write
  receipt: true

input:
  source: body
  fields:
    name: { type: string, rules: [required, "max:160"] }
    host_name: { type: "?string", rules: [optional] }
    mode: { type: "?string", rules: [optional, "in:delegated,autonomous"] }
    capabilities: { type: "?list<mixed>", rules: [optional] }
    reason: { type: "?string", rules: [optional, "max:500"] }
    preferred_method: { type: "?string", rules: [optional] }
    login_hint: { type: "?string", rules: [optional] }
    binding_message: { type: "?string", rules: [optional, "max:160"] }

domain:
  description: >
    A host with a key (POST /agents/hosts with public_key or jwks_url) registers an agent with the Ed25519
    key its JWT carries (agent_public_key). The agent belongs to the host's owner. The capabilities asked
    for go through the policy: when a person must approve all of them the agent is pending until they do
    (approval; GET /agent/status is polled), and rejected when they deny it. host_name and login_hint are
    not used. Recorded as agent.enrolled.

output:
  status: 200
  example:
    agent_id: "018f..."
    host_id: "018f..."
    name: "Claude Code"
    mode: delegated
    status: active
    agent_capability_grants: [{ capability: "deploy.staging", status: active, description: "Deploy a build to staging", input: { type: object }, budget: { kind: count, total: 100, remaining: 100, field: null } }]

errors:
  - { status: 400, code: invalid_request }
  - { status: 400, code: unsupported_mode }
  - { status: 400, code: unsupported_algorithm }
  - { status: 400, code: invalid_capabilities }
  - { status: 400, code: unknown_constraint_operator }
  - { status: 401, code: invalid_jwt }
  - { status: 403, code: host_revoked }
  - { status: 429, code: rate_limited }

events: [agent.enrolled, agent.grant.requested, agent.grant.approved]
