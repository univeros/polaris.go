# GET /magic-link/verify: the link from the email. It spends nothing (mail scanners open links).
endpoint:
  method: GET
  path: /magic-link/verify
  summary: Open a magic link
  tags: [passwordless]
  auth: public
  rate_limit: token_consume
  effect: read
  receipt: false

input:
  source: query
  fields:
    token: { type: string, rules: [required], sensitive: true }

domain:
  description: >
    Answers, for a live link, an HTML page (no JavaScript, Cache-Control no-store, Referrer-Policy
    no-referrer) with one "Sign in" button that posts back to this URL, where POST /magic-link/verify
    spends the link. Opening the link spends nothing, so an email security scanner that follows it
    leaves it usable. An unknown, used or expired token answers a problem document.

output:
  status: 200
  example: {}

errors:
  - { status: 422, code: passwordless_invalid_input }
  - { status: 422, code: passwordless_token_invalid }

events: []
