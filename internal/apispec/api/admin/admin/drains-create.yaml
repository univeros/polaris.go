# POST /admin/organizations/{id}/drains: create an audit drain.
endpoint:
  method: POST
  path: /admin/organizations/{id}/drains
  summary: Create an audit drain
  tags: [admin, audit]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: write
  receipt: true

input:
  source: body
  fields:
    endpoint: { type: string, rules: [required] }
    secret: { type: string, rules: [required], sensitive: true }
    filter: { type: "list<string>", rules: [optional] }

domain:
  description: >
    A signed webhook drain: an https endpoint on a public host, without credentials (a literal
    private, loopback or link-local address and localhost are 422), a secret of at least 16
    characters (encrypted at rest, never returned), an optional filter of names or prefix.*
    patterns. Delivered when the audit plugin's Drains is on: after the recording transaction
    commits, to public addresses only, without following redirects. last_error is a category
    (refused, timeout, unreachable, HTTP <status>). Needs own; recorded as admin.drain_created.

output:
  status: 201
  example:
    data:
      id: "018f..."
      organization_id: "018f..."
      type: "webhook"
      endpoint: "https://hooks.example.test/audit"
      filter: ["org.*"]
      status: "active"
      last_delivery_at: null
      last_error: null
      created_at: "2026-09-11T10:00:00Z"

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }
  - { status: 422, code: admin_invalid_input }

events: [admin.drain_created]
