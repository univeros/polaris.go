# POST /admin/users/{id}/impersonate: impersonate a user.
endpoint:
  method: POST
  path: /admin/users/{id}/impersonate
  summary: Impersonate a user
  tags: [admin, users]
  auth: public   # the admin middleware resolves the principal (an admin user or an API key)
  effect: write
  receipt: true

input:
  source: path
  fields:
    id: { type: string, rules: [required] }

domain:
  description: >
    An access token reading as the user for one access-token lifetime: no session behind it (no
    refresh, step-up, switch or logout), amr ["impersonation"], mfa false, no auth_time, and the
    impersonated_by claim. The admin routes refuse it, and so does every route that needs no
    permission and writes, destroys or is a step-up route (403 forbidden): it reads what the user
    reads and does what the user's permissions allow, not what only the account holder may
    (password, factors, passkeys, keys, sessions, deletion). A disabled account is 409; a
    superadmin cannot be impersonated (403 admin_impersonation_denied); below owner, neither can
    an operator of the caller's role or above (403 admin_forbidden). Needs impersonate; recorded
    as admin.user_impersonated.

output:
  status: 201
  example:
    data:
      access_token: "eyJ..."
      token_type: "Bearer"
      expires_in: 900
      impersonated_by: "018f..."

errors:
  - { status: 401, code: admin_unauthorized }
  - { status: 403, code: admin_forbidden }
  - { status: 403, code: admin_impersonation_denied }
  - { status: 404, code: admin_not_found }
  - { status: 409, code: admin_conflict }

events: [admin.user_impersonated]
