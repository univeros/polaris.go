# Fuzzing: every fuzz target for a bounded time, weekly and on demand. Not on pull requests: those
# run the seed corpora as unit tests in `make qa`. A failing input fails the run and is uploaded as
# the artifact "fuzz-failures"; commit it under the package's testdata/fuzz/<Target>/ with the fix.
name: fuzz

on:
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:
    inputs:
      fuzztime:
        description: Time per target (go test -fuzztime, e.g. 60s, 10m)
        required: true
        default: 60s
      targets:
        description: Only the targets whose name matches this regexp
        required: true
        default: "."

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: fuzz (every target)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26" # latest patch; go.mod's toolchain line names the minimum patched one
          check-latest: true
          cache: true
      - name: make fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '60s' }}
          TARGETS: ${{ inputs.targets || '.' }}
        run: scripts/fuzz.sh "$TARGETS" # make fuzz, without make's $ expansion of the regexp
      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failures
          path: "**/testdata/fuzz/**"
          if-no-files-found: warn
