# golangci-lint v2 configuration. Run with `make lint` (the version is pinned in the Makefile and
# fetched with `go run`, never added to go.mod). Every exclusion below says why; anything else is
# fixed in the code or carries a //nolint:<linter> // <reason> on the line.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        # Closing a response body or a read-only file after reading it: nothing to recover.
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (*database/sql.Conn).Close
        - (*database/sql.Rows).Close # rows.Err() is what reports a failed iteration
        # Deferred cleanup of a temporary directory.
        - os.RemoveAll
        # The CLI's and examples' terminal output: a failed write to stdout/stderr has no remedy.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - io.WriteString
    gosec:
      excludes:
        # Hardcoded credentials: matches identifiers and wire names (claim, column, event and
        # endpoint names containing "token", "secret", "password"); secrets only come from Config.
        - G101
    revive:
      # The basic set: correctness and naming rules, not style preferences. error-strings is left
      # out: error texts are wire messages clients match on (frozen) and often start with a
      # proper noun ("Polaris", "JWT").
      rules:
        - name: blank-imports
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T,testing.TB"
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unreachable-code
        - name: var-declaration
    staticcheck:
      checks:
        - all
        # golangci-lint's defaults: package-comment and naming style.
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Error texts are wire messages (see revive above).
        - -ST1005
        # Style-only quick fixes (De Morgan rewrites, embedded-field selectors).
        - -QF1001
        - -QF1008
  exclusions:
    generated: lax
    rules:
      # Tests drive handlers through httptest recorders and contracttest's in-memory client: the
      # responses hold no connection to close or context to carry (tests are not request-scoped);
      # test keys, fixture paths and permissive temp files are deliberate.
      - path: _test\.go
        linters: [bodyclose, noctx, gosec, contextcheck]
      # Test infrastructure packages (in-memory client, fixture recorder, database matrix).
      - path: (internal/contracttest|store/storetest|polaristest|internal/e2e)/
        linters: [gosec, noctx, contextcheck]
      # llms.txt snippets: compiled to keep the published examples honest, never called; they
      # show the calls, not the error handling.
      - path: ^llms_test\.go$
        linters: [unused, ineffassign, staticcheck]
