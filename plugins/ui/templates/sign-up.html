{{define "content"}}
<form method="post" action="{{.Base}}/sign-up">
<input type="hidden" name="csrf" value="{{.CSRF}}">
<label for="email">{{.T.email}}</label>
<input id="email" name="email" type="email" autocomplete="email" required maxlength="320" value="{{.Email}}" autofocus>
<label for="password">{{.T.password}}</label>
<input id="password" name="password" type="password" autocomplete="new-password" required minlength="{{.MinLength}}" aria-describedby="password-hint">
<p class="hint" id="password-hint">{{.PasswordHint}}</p>
<button type="submit">{{.T.sign_up}}</button>
</form>
<p>{{.T.have_account}} <a href="{{.Base}}/sign-in">{{.T.sign_in}}</a></p>
{{end}}
