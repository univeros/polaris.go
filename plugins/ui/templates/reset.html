{{define "content"}}
<form method="post" action="{{.Base}}/reset">
<input type="hidden" name="csrf" value="{{.CSRF}}">
{{if .TokenGiven}}<input type="hidden" name="token" value="{{.Token}}">{{else}}<label for="token">{{.T.reset_code}}</label>
<input id="token" name="token" type="text" autocomplete="one-time-code" required maxlength="512" value="{{.Token}}" autofocus>
{{end}}<label for="new_password">{{.T.new_password}}</label>
<input id="new_password" name="new_password" type="password" autocomplete="new-password" required minlength="{{.MinLength}}" aria-describedby="password-hint"{{if .TokenGiven}} autofocus{{end}}>
<p class="hint" id="password-hint">{{.PasswordHint}}</p>
<button type="submit">{{.T.reset}}</button>
</form>
{{end}}
